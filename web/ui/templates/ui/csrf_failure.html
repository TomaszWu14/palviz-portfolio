{% load static %}<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sesja wygasła — {{ app_name }}</title>
  <style>
    /* Strona standalone (poza motywem app) — lokalne tokeny sceny błędu. */
    :root { --bg:#0f172a; --ink:#e2e8f0; --muted:#94a3b8; --accent:#6b21a8; --surface:#334155; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           padding:24px; background:var(--bg); color:var(--ink);
           font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    .box { width:100%; max-width:420px; text-align:center; }
    .ico { font-size:52px; line-height:1; margin-bottom:10px; }
    h1 { font-size:22px; margin:6px 0 8px; }
    p { color:var(--muted); font-size:14px; line-height:1.5; margin:0 0 18px; }
    .btn { display:block; width:100%; padding:16px; border:0; border-radius:12px;
           font-size:17px; font-weight:700; text-decoration:none; margin-top:12px; cursor:pointer; }
    .p { background:var(--accent); color:#fff; }
    .g { background:var(--surface); color:var(--ink); }
  </style>
</head>
<body>
  <div class="box">
    <div class="ico">🔒</div>
    <h1>Sesja wygasła</h1>
    <p>Weryfikacja bezpieczeństwa (CSRF) nie powiodła się — zwykle to po prostu odświeżony
       token po dłuższej przerwie albo ponownym zalogowaniu. Zaloguj się ponownie.</p>
    <a class="btn p" href="/login/">Zaloguj ponownie</a>
    <a class="btn g" href="javascript:location.reload()">Odśwież stronę</a>
  </div>
</body>
</html>

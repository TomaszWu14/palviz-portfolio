{% load i18n %}
{# Scoped CSS ZARIA — oparte na tokenach z base.html (bez inline-hex). Reużyte w home + conversation. #}
<style>
  /* Akcent ZARIA (fiolet modułu) jako lokalny token — flipuje razem z motywem przez alpha. */
  .zaria { --z-accent:#8b5cf6; --z-accent-soft:rgba(139,92,246,.14);
           --z-sidebar-w:280px; --z-context-w:300px; }
  :root[data-theme="light"] .zaria { --z-accent:#7c3aed; }

  .zaria { display:grid; grid-template-columns:var(--z-sidebar-w) minmax(0,1fr) var(--z-context-w);
           gap:0; height:calc(100vh - 96px); min-height:520px;
           border:1px solid var(--gray-200); border-radius:12px; overflow:hidden;
           background:var(--surface); box-shadow:var(--shadow); }
  .zaria--nocontext { grid-template-columns:var(--z-sidebar-w) minmax(0,1fr); }
  /* Tło drawera mobilnego — na desktopie MUSI być display:none, inaczej jako grid-item
     .zaria zjada kolumnę i spycha .z-main do 2. wiersza (280px). Reguły fixed/toggle w @media 768. */
  .z-overlay { display:none; }

  /* ── Sidebar ── */
  .z-side { display:flex; flex-direction:column; min-height:0;
            background:var(--gray-50); border-right:1px solid var(--gray-200); }
  .z-side__new { margin:14px; }
  .z-newbtn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
              padding:11px 14px; border:none; border-radius:8px; cursor:pointer;
              font-size:14px; font-weight:600; color:#fff; text-decoration:none;
              background:linear-gradient(180deg, var(--z-accent), var(--blue-dark));
              box-shadow:var(--shadow-sm); transition:filter .16s cubic-bezier(.2,.8,.2,1); }
  .z-newbtn:hover { filter:brightness(1.08); }
  .z-seg { display:flex; gap:2px; margin:0 14px 10px; padding:3px; border-radius:8px;
           background:var(--gray-100); }
  .z-seg__btn { flex:1; padding:6px 8px; border:none; background:none; cursor:pointer;
                font-size:12px; font-weight:600; color:var(--gray-500); border-radius:6px; }
  .z-seg__btn[aria-selected="true"] { background:var(--surface); color:var(--gray-900);
                box-shadow:var(--shadow-sm); }
  .z-search { margin:0 14px 8px; }
  .z-search input { width:100%; padding:8px 10px; font-size:13px; }
  .z-list { flex:1; overflow:auto; padding:4px 8px 12px; min-height:0; }
  .z-group { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
             color:var(--gray-400); padding:12px 8px 4px; }
  .z-item { display:block; padding:9px 10px; border-radius:8px; text-decoration:none;
            color:var(--gray-800); font-size:13px; line-height:1.35;
            border-left:3px solid transparent; }
  .z-item:hover { background:var(--z-accent-soft); }
  .z-item--active { background:var(--z-accent-soft); border-left-color:var(--z-accent); }
  .z-item__meta { font-size:11px; color:var(--gray-400); margin-top:2px; }
  .z-empty { padding:28px 16px; text-align:center; color:var(--gray-500); font-size:13px; }

  /* ── Stopka sidebara: motyw + język + user ── */
  .z-foot { border-top:1px solid var(--gray-200); padding:10px 14px;
            display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .z-foot__user { flex:1; min-width:0; font-size:12px; color:var(--gray-500);
                  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .z-toggle { display:inline-flex; border:1px solid var(--gray-300); border-radius:8px; overflow:hidden; }
  .z-toggle button { border:none; background:none; cursor:pointer; padding:5px 9px;
                     font-size:12px; font-weight:600; color:var(--gray-500); }
  .z-toggle button[aria-pressed="true"] { background:var(--z-accent-soft); color:var(--gray-900); }

  /* ── Okno rozmowy ── */
  .z-main { display:flex; flex-direction:column; min-width:0; min-height:0; background:var(--surface); }
  .z-head { display:flex; align-items:center; gap:12px; padding:14px 18px;
            border-bottom:1px solid var(--gray-200); }
  .z-head__title { font-weight:700; font-size:15px; color:var(--gray-900);
                   overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .z-head__meta { font-size:12px; color:var(--gray-500); }
  .z-badge { display:inline-block; padding:2px 9px; border-radius:999px; font-size:11px;
             font-weight:600; text-transform:uppercase; letter-spacing:.06em;
             background:var(--z-accent-soft); border:1px solid var(--gray-300); color:var(--gray-700); }
  .z-num { font-variant-numeric:tabular-nums; }

  .z-scroll { flex:1; overflow:auto; padding:20px 18px; display:flex; flex-direction:column; gap:14px;
              min-height:0; }
  .z-bubble { max-width:76%; padding:11px 15px; border-radius:16px; font-size:14px; line-height:1.5;
              white-space:pre-wrap; box-shadow:var(--shadow-sm); }
  .z-bubble--user { align-self:flex-end; background:var(--z-accent-soft);
                    border:1px solid var(--gray-300); color:var(--gray-900); border-bottom-right-radius:6px; }
  .z-bubble--ai { align-self:flex-start; background:var(--gray-100);
                  border:1px solid var(--gray-200); color:var(--gray-900); border-bottom-left-radius:6px; }
  .z-bubble__meta { font-size:11px; color:var(--gray-400); margin-top:6px; font-variant-numeric:tabular-nums; }
  .z-bubble--err { color:var(--red); }

  /* Pulsujący kursor „generuję…” (imitacja streamingu — bez zmian backendu). */
  .z-typing { align-self:flex-start; display:inline-flex; align-items:center; gap:6px;
              color:var(--gray-500); font-size:13px; }
  .z-typing::after { content:""; width:7px; height:14px; background:var(--z-accent);
                     border-radius:2px; animation:z-blink 1s steps(2,start) infinite; }
  @keyframes z-blink { 0%,100%{opacity:1} 50%{opacity:.2} }

  .z-tiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px;
             padding:6px 0 4px; }
  .z-tile { text-align:left; padding:14px; border:1px solid var(--gray-200); border-radius:12px;
            background:var(--surface); cursor:pointer; box-shadow:var(--shadow-sm);
            transition:transform .16s cubic-bezier(.2,.8,.2,1), box-shadow .16s, border-color .16s; }
  .z-tile:hover { transform:translateY(-2px); box-shadow:var(--shadow-lg); border-color:var(--z-accent); }
  .z-tile__t { font-weight:600; font-size:14px; color:var(--gray-900); margin-bottom:3px; }
  .z-tile__d { font-size:12px; color:var(--gray-500); }

  .z-compose { border-top:1px solid var(--gray-200); padding:12px 16px; }
  .z-compose__row { display:flex; gap:10px; align-items:flex-end; }
  .z-compose textarea { flex:1; resize:none; min-height:44px; max-height:180px; padding:10px 12px; }
  .z-quick { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }

  /* ── Tryb porównania: dwie kolumny ── */
  .z-cmp { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .z-col { display:flex; flex-direction:column; min-width:0; border:1px solid var(--gray-200);
           border-radius:12px; background:var(--surface); overflow:hidden; }
  .z-col__head { padding:8px 12px; border-bottom:1px solid var(--gray-200);
                 display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; }
  .z-col__body { padding:12px; font-size:14px; line-height:1.5; white-space:pre-wrap;
                 overflow:auto; flex:1; min-height:60px; }
  .z-col__meta { padding:0 12px 8px; font-size:11px; color:var(--gray-400); font-variant-numeric:tabular-nums; }
  .z-col__actions { padding:8px 12px; border-top:1px solid var(--gray-200); display:flex; gap:8px; }
  .z-col--rejected { opacity:.5; }
  .z-col--picked { border-color:var(--z-accent); box-shadow:var(--glow-accent, 0 0 0 1px var(--z-accent)); }
  .z-cmp-user { align-self:flex-end; }
  @media (max-width:1200px) {
    .z-cmp { grid-template-columns:1fr; }
    .z-cmp[data-tab="b"] .z-col--a { display:none; }
    .z-cmp[data-tab="a"] .z-col--b { display:none; }
    .z-cmptabs { display:flex; gap:6px; margin-bottom:8px; }
  }
  .z-cmptabs { display:none; }

  /* ── Panel kontekstu ── */
  .z-ctx { display:flex; flex-direction:column; gap:16px; padding:16px;
           background:var(--gray-50); border-left:1px solid var(--gray-200); overflow:auto; min-height:0; }
  .z-ctx__h { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
              color:var(--gray-400); }
  .z-silver { height:1px; background:linear-gradient(90deg,transparent,var(--gray-400),transparent);
              opacity:.5; }
  /* Sygnaturowy pasek zużycia — segmentowany, zmienia kolor przy 75/90%. */
  .z-usage__bar { height:8px; border-radius:999px; background:var(--gray-200); overflow:hidden;
                  margin:6px 0 4px; }
  .z-usage__fill { height:100%; border-radius:999px; background:var(--green-solid);
                   transition:width .5s cubic-bezier(.2,.8,.2,1); }
  .z-usage__fill--warn { background:var(--yellow); }
  .z-usage__fill--crit { background:var(--red-solid); }
  .z-usage__cap { font-size:12px; color:var(--gray-500); font-variant-numeric:tabular-nums; }

  /* Zwijanie panelu kontekstu / drawer sidebara. */
  .z-ctxtoggle, .z-drawerbtn { display:none; }
  @media (max-width:1024px) {
    .zaria { grid-template-columns:var(--z-sidebar-w) minmax(0,1fr); }
    .z-ctx { position:fixed; right:0; top:0; bottom:0; width:min(320px,86vw); z-index:60;
             box-shadow:var(--shadow-lg); transform:translateX(100%); transition:transform .2s; }
    .zaria[data-ctx="open"] .z-ctx { transform:translateX(0); }
    .z-ctxtoggle { display:inline-flex; }
  }
  @media (max-width:768px) {
    .zaria { grid-template-columns:minmax(0,1fr); height:calc(100vh - 80px); }
    .z-side { position:fixed; left:0; top:0; bottom:0; width:min(300px,88vw); z-index:70;
              transform:translateX(-100%); transition:transform .2s; box-shadow:var(--shadow-lg); }
    .zaria[data-side="open"] .z-side { transform:translateX(0); }
    .z-drawerbtn { display:inline-flex; }
    .z-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:55; }
    .zaria[data-side="open"] .z-overlay, .zaria[data-ctx="open"] .z-overlay { display:block; }
  }
  @media (prefers-reduced-motion: reduce) {
    .z-tile, .z-newbtn, .z-usage__fill, .z-side, .z-ctx { transition:none; }
    .z-typing::after { animation:none; }
  }
  .zaria :focus-visible { outline:2px solid var(--z-accent); outline-offset:2px; border-radius:4px; }
</style>
<script>
  // Przełączniki motyw/język → POST /prefs/ (bez reloadu dla motywu; reload po zmianie języka
  // żeby LocaleMiddleware odczytał cookie). CSRF z ciasteczka.
  window.zariaPrefs = function (kind, value) {
    var m = document.cookie.match(/(?:^|;\s*)csrftoken=([^;]+)/);
    var body = new URLSearchParams(); body.set(kind, value);
    fetch("{% url 'ui:set_prefs' %}", {method:"POST", headers:{
      "X-CSRFToken": m ? m[1] : "", "Content-Type":"application/x-www-form-urlencoded"},
      body: body.toString()}).then(function(r){
        if (kind === "theme") {
          document.documentElement.setAttribute("data-theme", value);
          try { localStorage.setItem("ui-theme", value); } catch(e){}
        } else if (kind === "lang" && r.ok) { location.reload(); }
      });
  };
  window.zariaDrawer = function (which) {
    var z = document.querySelector(".zaria"); if (!z) return;
    var attr = which === "ctx" ? "data-ctx" : "data-side";
    z.setAttribute(attr, z.getAttribute(attr) === "open" ? "closed" : "open");
  };
</script>

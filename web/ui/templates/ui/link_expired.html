<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Link nieaktywny — {{ app_name }}</title>
  <style>
    /* Strona standalone dla odbiorców zewnętrznych (kierowca) — lokalne tokeny jak csrf_failure.html. */
    :root { --bg:#0f172a; --ink:#e2e8f0; --muted:#94a3b8; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           padding:24px; background:var(--bg); color:var(--ink);
           font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    .box { width:100%; max-width:420px; text-align:center; }
    .ico { font-size:52px; line-height:1; margin-bottom:10px; }
    h1 { font-size:22px; margin:6px 0 8px; }
    p { color:var(--muted); font-size:15px; line-height:1.5; margin:0; }
  </style>
</head>
<body>
  <main class="box">
    <div class="ico" aria-hidden="true">⌛</div>
    <h1>Link jest już nieaktywny</h1>
    <p>Odbiór tej przesyłki został zakończony lub anulowany albo link wygasł.
       Jeśli potrzebujesz informacji, skontaktuj się z nadawcą.</p>
  </main>
</body>
</html>

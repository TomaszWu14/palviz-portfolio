<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<style>
  @page { size: A4 landscape; margin: 1.5cm; }
  body { font-family: "DejaVu Sans", sans-serif; font-size: 9px; color: #1a1a2e; }
  h1 { font-size: 16px; margin: 0 0 2px; }
  .sub { color: #666; font-size: 10px; margin-bottom: 12px; }
  table { width: 100%; border-collapse: collapse; }
  th { background: #1E40AF; color: #fff; padding: 4px 6px; text-align: left; }
  td { padding: 3px 6px; border-bottom: 1px solid #ddd; }
  tr:nth-child(even) td { background: #f3f6fb; }
</style>
</head>
<body>
  <h1>{{ app_name }} — Master data lokalizacji</h1>
  <div class="sub">{{ total }} lokalizacji</div>
  <table>
    <thead>
      <tr>{% for title in columns %}<th>{{ title }}</th>{% endfor %}</tr>
    </thead>
    <tbody>
      {% for row in rows %}
      <tr>{% for v in row %}<td>{{ v }}</td>{% endfor %}</tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>

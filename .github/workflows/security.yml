name: Security

# Security scanners that complement CodeQL (SAST) and Dependabot (dependency PRs):
#   • gitleaks     — secret detection (gated: a leaked secret fails the run)
#   • Trivy        — filesystem scan: dependency CVEs, IaC/Dockerfile misconfig, secrets
#   • pip-audit    — Python dependency CVEs (PyPI advisory DB)
#   • Bandit       — Python static security analysis
#   • npm audit    — front-end dependency CVEs (web/package-lock.json)
#
# All are informational (non-blocking) EXCEPT gitleaks — a committed secret is worth
# failing on. SARIF is uploaded to the Security ▸ Code scanning tab when GitHub Advanced
# Security is enabled (this repo is private, so GHAS is required for the tab); the
# uploads are continue-on-error so the run stays green without GHAS, and every scanner
# also prints human-readable output to the job log regardless.

on:
  schedule:
    - cron: "0 5 * * 1"    # co tydzień, poniedziałek 05:00 UTC (audyt CICD-006)
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Secret detection — the one gating scan ──────────────────────────────────
  gitleaks:
    name: gitleaks (secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read     # gitleaks-action lists PR commits on pull_request events
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0        # scan full history, not just the tip commit
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks-action is free for personal-account repos; GITLEAKS_LICENSE is
          # only needed for GitHub Organizations.

  # ── Trivy filesystem scan: CVEs + misconfig + secrets ───────────────────────
  # Runs on the weekly schedule + manual dispatch (no PR/push trigger).
  # PRs are not scanned here — the CI gate (ci.yml) does not run these scanners.
  trivy:
    name: Trivy (fs)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Trivy — human-readable (table, non-blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          format: table
          exit-code: "0"          # informational — surface, don't fail
          ignore-unfixed: true
          skip-dirs: web/ui/static/ui/vendor

      - name: Trivy — SARIF (for code scanning)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          skip-dirs: web/ui/static/ui/vendor

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        continue-on-error: true   # needs GHAS on private repos
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

  # ── Python: dependency CVEs + static security ───────────────────────────────
  # NOT part of the PR gate (ci.yml runs no pip-audit/Bandit, decyzja 2026-08-18) —
  # they run only on the weekly schedule + manual dispatch.
  python-audit:
    name: pip-audit + Bandit
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install scanners
        run: pip install pip-audit "bandit[sarif]"

      - name: pip-audit (dependency CVEs)
        continue-on-error: true   # informational
        run: pip-audit -r requirements.txt --desc

      - name: Bandit (static security, readable)
        continue-on-error: true   # informational — config in pyproject [tool.bandit]
        run: bandit -c pyproject.toml -r web/ui palletizer -q

      - name: Bandit — SARIF
        continue-on-error: true
        run: bandit -c pyproject.toml -r web/ui palletizer -f sarif -o bandit.sarif || true

      - name: Upload Bandit SARIF
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        continue-on-error: true   # needs GHAS on private repos
        with:
          sarif_file: bandit.sarif
          category: bandit

  # ── Front-end dependency CVEs ───────────────────────────────────────────────
  # Runs on the weekly schedule + manual dispatch.
  npm-audit:
    name: npm audit (frontend)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps (from lockfile)
        run: npm ci --ignore-scripts

      - name: npm audit
        continue-on-error: true   # informational
        run: npm audit --audit-level=high

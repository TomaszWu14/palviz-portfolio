name: CodeQL

# Static analysis (SAST) for Python + JavaScript. Results land in the repo's
# Security ▸ Code scanning tab.
#
# NOTE: this repo is PRIVATE. GitHub code scanning on private repos requires
# GitHub Advanced Security (Settings ▸ Code security ▸ enable). With GHAS off,
# the SARIF upload 403s — the `analyze` step is marked continue-on-error so that
# only annotates the run instead of red-Xing it. Turn GHAS on to get the full
# Security-tab integration; nothing else needs to change.

on:
  schedule:
    # Monthly full scan (1st of the month, 05:17 UTC) catches newly published CodeQL rules
    # even when nothing changed.
    - cron: "17 5 1 * *"
  workflow_dispatch:

# A newer run on the same ref supersedes an in-flight one.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload SARIF to code scanning (needs GHAS on private repos)
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        # continue-on-error: without GHAS the SARIF upload 403s; don't fail the run for it.
        continue-on-error: true
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: "/language:${{ matrix.language }}"
